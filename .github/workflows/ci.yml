name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest run per branch matters; do not queue duplicates.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  quality:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the same value as the "packageManager" field in
          # package.json, which corepack uses locally. The action fails if the
          # two ever disagree.
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Blocking on purpose: dropping it would hide regressions, and a gate that
        # is never green is indistinguishable from a broken one.
        run: pnpm exec nx run-many -t lint

      - name: Test
        run: pnpm exec nx run-many -t test

      - name: Build
        run: pnpm exec nx run-many -t build
